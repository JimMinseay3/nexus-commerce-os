      - in: query
        name: status
        schema:
          type: string
          enum:
          - allocating
          - backorder
          - cancelled
          - closed
          - completed
          - partially_shipped
          - pending
          - picking
          - ready
          - refunded
          - shipped
        description: |-
          * `pending` - 待确认
          * `allocating` - 待分配
          * `backorder` - 缺货
