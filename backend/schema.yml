          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        shipped_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        returned_quantity:
          type: string
          format: decimal
          pattern: ^-?\d{0,8}(?:\.\d{0,4})?$
        unit_price:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        tax:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        discount:
          type: string
          format: decimal
          pattern: ^-?\d{0,14}(?:\.\d{0,4})?$
        order:
          type: string
          format: uuid
        sku:
          type: string
          format: uuid
          nullable: true
      required:
      - created_at
      - external_line_id
      - external_sku
      - id
      - order
      - quantity
      - sku_code
      - updated_at
    OrderStatusEnum:
      enum:
      - pending
      - allocating
      - backorder
      - picking
      - ready
      - partially_shipped
      - shipped
      - completed
      - cancelled
      - refunded
      - closed
      type: string
      description: |-
        * `pending` - 待确认
        * `allocating` - 待分配
        * `backorder` - 缺货
        * `picking` - 待拣货
        * `ready` - 待发货
        * `partially_shipped` - 部分发货
        * `shipped` - 已发货
        * `completed` - 已完成
        * `cancelled` - 已取消
        * `refunded` - 已退款
        * `closed` - 已关闭
    Package:
      type: object
      properties:
        id:
          type: string
          format: uuid
          readOnly: true
        items:
          type: array
          items:
            $ref: '#/components/schemas/ShipmentItem'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
        package_no:
          type: string
          maxLength: 80
        carrier:
          type: string
          maxLength: 80
        service:
          type: string
          maxLength: 80
        tracking_number:
          type: string
          maxLength: 160
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,9}(?:\.\d{0,3})?$
        dimensions: {}
        shipment:
          type: string
          format: uuid
      required:
      - carrier
      - created_at
      - id
      - items
      - package_no
      - shipment
      - tracking_number
      - updated_at
